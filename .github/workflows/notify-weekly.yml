name: Weekly dashboard notification

# Thursday 07:00 IST (UTC+5:30, no DST) == Thursday 01:30 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 4" # Thursday 01:30 UTC = Thursday 7am IST

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libpq (psycopg2 builds from source, not -binary)
        run: sudo apt-get install -y libpq-dev
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2 python-dotenv

      - name: Send weekly email
        run: python3 Website_frontend/notify_weekly.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
