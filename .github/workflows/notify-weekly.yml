name: Weekly dashboard notification

# Friday 04:00 IST (UTC+5:30, no DST) == Thursday 22:30 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 4" # Thursday 22:30 UTC = Friday 4am IST

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Send weekly email
        run: python3 notify_weekly.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
