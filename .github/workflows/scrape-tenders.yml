name: Scrape tenders

# Saturday 16:00 IST (UTC+5:30, no DST) == Saturday 10:30 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 6" # Saturday 10:30 UTC = Saturday 4pm IST

jobs:
  scrape-tenders:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run tender scraper
        run: python -m Scraper_backend_tenders.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all_tenders_pipeline
          path: Scraper_backend_tenders/all_tenders_pipeline.xlsx
          if-no-files-found: ignore
