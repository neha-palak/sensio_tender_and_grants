name: Scrape tenders

# --- To change the day/time this fires ---
# cron format is "minute hour * * weekday", always in UTC.
#   1. Pick your target time in IST, subtract 5:30 to get UTC (IST has no
#      DST, so this offset never changes): e.g. 4:00 PM IST -> 10:30 AM UTC.
#      If subtracting 5:30 goes below 0:00, the UTC day rolls back one day
#      (e.g. 4:00 AM IST -> 10:30 PM UTC the PREVIOUS day).
#   2. weekday is 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday,
#      5=Friday, 6=Saturday -- use the UTC day from step 1, not the IST one,
#      if step 1 rolled the day back.
#   3. Update both the cron line below AND this comment.
# Note GitHub's scheduled triggers can run late, sometimes by an hour or
# more, especially for once-a-week schedules -- budget for that when
# picking a time (see HANDOFF.md's Landmines section). Also remember: local
# execution via executables/run_tenders.command is the recommended path (see
# HANDOFF.md's "Local execution vs. full CI automation") -- this schedule is
# a fallback safety net, not the primary way this is meant to run.
#
# Saturday 16:00 IST (UTC+5:30, no DST) == Saturday 10:30 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 6" # Saturday 10:30 UTC = Saturday 4pm IST

jobs:
  scrape-tenders:
    runs-on: ubuntu-latest
    # The scraper itself caps a run at 30 min (OVERALL_TIMEOUT in main.py); this
    # leaves headroom for setup/install so a hang fails loudly instead of
    # silently burning CI minutes toward GitHub's 6-hour default job timeout.
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install libpq (psycopg2 builds from source, not -binary)
        run: sudo apt-get install -y libpq-dev
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
        env:
          # Ubuntu 24.04 runners ship needrestart, which can interactively
          # prompt ("Which services should be restarted?") during apt-get
          # install with no terminal attached -- silently hanging the job
          # instead of erroring. Force it non-interactive.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run tender scraper
        run: python -m Scraper_backend_tenders.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # llm_fallback.py shells out to the `claude` CLI. Locally that runs on
          # the interactive Claude Code login (Pro/Max); CI has no such login,
          # so it authenticates via ANTHROPIC_API_KEY instead (separate
          # Anthropic Console billing from the Claude subscription).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all_tenders_pipeline
          path: Scraper_backend_tenders/all_tenders_pipeline.xlsx
          if-no-files-found: ignore
